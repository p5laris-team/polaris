syntax = "proto3";

package p5laris.character.v1;

option java_multiple_files = true;
option java_package = "com.p5laris.proto.character.v1";
option java_outer_classname = "CharacterProto";

service CharacterService {
  rpc PingPong(PingPongRequest) returns (PingPongResponse);
  rpc GetCharacterTypes(GetCharacterTypesRequest) returns (GetCharacterTypesResponse);
  rpc GetCharacterAssets(GetCharacterAssetsRequest) returns (GetCharacterAssetsResponse);
  rpc CreateCharacter(CreateCharacterRequest) returns (CreateCharacterResponse);
  rpc GetMyCharacter(GetMyCharacterRequest) returns (GetMyCharacterResponse);
  rpc UpdateCharacterName(UpdateCharacterNameRequest) returns (UpdateCharacterNameResponse);
  rpc GetCharacterStatus(GetCharacterStatusRequest) returns (GetCharacterStatusResponse);
  rpc PerformCareAction(PerformCareActionRequest) returns (PerformCareActionResponse);
  rpc EquipSkin(EquipSkinRequest) returns (EquipSkinResponse);
  // Share APIs (spec §9)
  rpc CreateShareCard(CreateShareCardRequest) returns (CreateShareCardResponse);
  rpc GetShareCard(GetShareCardRequest) returns (GetShareCardResponse);
  rpc CreateShareEvent(CreateShareEventRequest) returns (CreateShareEventResponse);
  rpc GetShareLink(GetShareLinkRequest) returns (GetShareLinkResponse);
  rpc RecordShareClick(RecordShareClickRequest) returns (RecordShareClickResponse);
  rpc GetTodayShareEventStatus(GetTodayShareEventStatusRequest) returns (GetTodayShareEventStatusResponse);
  rpc GetSharePresignedUrl(GetSharePresignedUrlRequest) returns (GetSharePresignedUrlResponse);
}

// GetCharacterTypes: returns active character types ordered by sort_order
message GetCharacterTypesRequest {}

message GetCharacterTypesResponse {
  repeated CharacterTypeItem items = 1;
}

message CharacterTypeItem {
  int64 id = 1;
  string code = 2;
  string name = 3;
  string summary = 4;
  string sample_line = 5;
  int32 sort_order = 6;
}

// GetCharacterAssets: returns assets for a given character type
message GetCharacterAssetsRequest {
  int64 character_type_id = 1;
}

message GetCharacterAssetsResponse {
  int64 character_type_id = 1;
  repeated CharacterAssetItem items = 2;
}

message CharacterAssetItem {
  string asset_type = 1;
  string asset_url = 2;
}

// PingPong (scaffolding)
message PingPongRequest {
  string message = 1;
}

message PingPongResponse {
  HealthStatus health_status = 1;
  string message = 2;
}

enum HealthStatus {
  HEALTH_STATUS_UNSPECIFIED = 0;
  HEALTHY = 1;
  UNHEALTHY = 2;
  DEGRADED = 3;
}

// CreateCharacter: creates a user character
message CreateCharacterRequest {
  int64 user_id = 1;
  int64 character_type_id = 2;
  string name = 3;
}

message CreateCharacterResponse {
  int64 id = 1;
  string name = 2;
  string character_type_code = 3;
  bool active = 4;
  CharacterStates states = 5;
  string created_at = 6;
}

message CharacterStates {
  int32 hunger = 1;
  int32 energy = 2;
  int32 affection = 3;
}

// GetMyCharacter: returns the user's active character
message GetMyCharacterRequest {
  int64 user_id = 1;
}

message GetMyCharacterResponse {
  int64 id = 1;
  string name = 2;
  string character_type_code = 3;
  bool active = 4;
  int64 equipped_skin_id = 5; // Can be 0 if no skin is equipped
}

// UpdateCharacterName: updates character name
message UpdateCharacterNameRequest {
  int64 character_id = 1;
  int64 user_id = 2; // For ownership validation
  string name = 3;
}

message UpdateCharacterNameResponse {
  int64 id = 1;
  string name = 2;
  string updated_at = 3;
}

// GetCharacterStatus: returns character status values and labels
message GetCharacterStatusRequest {
  int64 character_id = 1;
  int64 user_id = 2; // ownership validation
}

message GetCharacterStatusResponse {
  int64 character_id = 1;
  CharacterStateDetail hunger = 2;
  CharacterStateDetail energy = 3;
  CharacterStateDetail affection = 4;
}

message CharacterStateDetail {
  int32 value = 1;
  string label = 2;
  string grade = 3;
}

// PerformCareAction: performs a care action (FEED/SLEEP/PLAY) on a character
message PerformCareActionRequest {
  int64 character_id = 1;
  int64 user_id = 2;       // ownership validation
  string action_type = 3;  // FEED | SLEEP | PLAY
  int64 item_id = 4;       // 0 if no item used
  string idempotency_key = 5;
}

message PerformCareActionResponse {
  int64 care_log_id = 1;
  int64 character_id = 2;
  string action_type = 3;
  int64 consumed_item_id = 4;   // 0 if no item consumed
  int32 consumed_quantity = 5;  // 0 if no item consumed
  CharacterStates before_states = 6;
  CharacterStates after_states = 7;
  string character_message = 8;
}

// EquipSkin: equips a skin item on a character
message EquipSkinRequest {
  int64 character_id = 1;
  int64 user_id = 2;   // ownership validation
  int64 item_id = 3;   // skin item to equip
}

message EquipSkinResponse {
  int64 character_id = 1;
  int64 equipped_skin_id = 2;
  string updated_at = 3;
}

// CreateShareCard: creates a share card for user's character (spec 9.1)
message CreateShareCardRequest {
  int64 user_id = 1;
  int64 character_id = 2;
  string headline = 3; // User-provided message rendered into the card image
}

message CreateShareCardResponse {
  int64 share_card_id = 1;
  string share_id = 2;
  string image_url = 3;
  string share_url = 4;
}

// GetShareCard: retrieves an owned share card detail (spec 9.2)
message GetShareCardRequest {
  int64 share_card_id = 1;
  int64 user_id = 2; // ownership validation
}

message GetShareCardResponse {
  int64 share_card_id = 1;
  string character_name = 2;
  string image_url = 3;
  string share_url = 4;
}

// CreateShareEvent: records a share event and pays daily reward (spec 9.3)
message CreateShareEventRequest {
  int64 user_id = 1;
  int64 share_card_id = 2;
  string platform = 3;
  string share_type = 4;
  string idempotency_key = 5;
}

message CreateShareEventResponse {
  int64 share_event_id = 1;
  bool reward_paid = 2;
  int32 reward_star_piece = 3;
  int32 wallet_star_piece = 4; // updated wallet balance (0 if wallet not yet integrated)
}

// GetShareLink: public endpoint - returns shared card info (spec 9.4)
message GetShareLinkRequest {
  string share_id = 1;
}

message GetShareLinkResponse {
  string share_id = 1;
  string character_name = 2;
  string image_url = 3;
  string headline = 4;
  string signup_url = 5;
}

// RecordShareClick: public endpoint - records a share link click (spec 9.5)
message RecordShareClickRequest {
  string share_id = 1;
  string referrer = 2;
  string utm_source = 3;
  string utm_medium = 4;
  string utm_campaign = 5;
}

message RecordShareClickResponse {
  string share_id = 1;
  bool recorded = 2;
}

// GetTodayShareEventStatus: returns today's share reward status (spec: GET /api/share/v1/share-events/today)
message GetTodayShareEventStatusRequest {
  int64 user_id = 1;
}

message GetTodayShareEventStatusResponse {
  bool reward_claimed = 1;
  string last_shared_at = 2; // ISO-8601 instant; empty when never shared
}

// GetSharePresignedUrl: issues presigned URL for S3 upload
message GetSharePresignedUrlRequest {
  int64 user_id = 1;
  string extension = 2; // e.g. "png", "jpg"
}

message GetSharePresignedUrlResponse {
  string presigned_url = 1; // temporary URL for upload
  string image_url = 2;     // final public URL
}

