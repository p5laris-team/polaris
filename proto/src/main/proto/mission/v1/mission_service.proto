syntax = "proto3";

package p5laris.mission.v1;

option java_multiple_files = true;
option java_package = "com.p5laris.proto.mission.v1";
option java_outer_classname = "MissionProto";

service MissionService {
  rpc PingPong(PingPongRequest) returns (PingPongResponse);
  rpc GetCurrentMission(GetCurrentMissionRequest) returns (GetCurrentMissionResponse);
  rpc GetTodayMissions(GetTodayMissionsRequest) returns (GetTodayMissionsResponse);
  rpc GetMissionDetail(GetMissionDetailRequest) returns (GetMissionDetailResponse);
  rpc CreateNextMission(CreateNextMissionRequest) returns (CreateNextMissionResponse);
  rpc RejectMission(RejectMissionRequest) returns (RejectMissionResponse);
  rpc StartCompletionSession(StartCompletionSessionRequest) returns (StartCompletionSessionResponse);
  rpc SubmitCompletionAnswer(SubmitCompletionAnswerRequest) returns (SubmitCompletionAnswerResponse);
  rpc UpsertMissionFeedback(UpsertMissionFeedbackRequest) returns (UpsertMissionFeedbackResponse);
}

message PingPongRequest {
  string message = 1;
}

message PingPongResponse {
  HealthStatus health_status = 1;
  string message = 2;
}

enum HealthStatus {
  HEALTH_STATUS_UNSPECIFIED = 0;
  HEALTHY = 1;
  UNHEALTHY = 2;
  DEGRADED = 3;
}

message GetCurrentMissionRequest {
  int64 user_id = 1;
  int64 character_id = 2;
}

message GetCurrentMissionResponse {
  Mission mission = 1;
}

message GetTodayMissionsRequest {
  int64 user_id = 1;
  optional string mission_date = 2;
}

message GetTodayMissionsResponse {
  string mission_date = 1;
  int32 max_daily_offers = 2;
  int32 offered_count = 3;
  int32 completed_count = 4;
  int32 rejected_count = 5;
  int32 remaining_offer_count = 6;
  optional int64 current_mission_id = 7;
  repeated TodayMission missions = 8;
  int32 max_daily_reward_count = 9;
  int32 completed_reward_count = 10;
  int32 remaining_reward_count = 11;
  int32 max_daily_reject_count = 12;
  int32 remaining_reject_count = 13;
}

message GetMissionDetailRequest {
  int64 user_id = 1;
  int64 mission_id = 2;
}

message GetMissionDetailResponse {
  MissionDetail mission = 1;
}

message CreateNextMissionRequest {
  int64 user_id = 1;
  int64 character_id = 2;
  int64 last_mission_id = 3;
}

message CreateNextMissionResponse {
  Mission mission = 1;
}

message RejectMissionRequest {
  int64 user_id = 1;
  int64 character_id = 2;
  int64 mission_id = 3;
  optional string reason_code = 4;
  optional string reason_text = 5;
}

message RejectMissionResponse {
  int64 mission_id = 1;
  MissionStatus status = 2;
  string rejected_at = 3;
  string character_message = 4;
  MissionSummary next_mission = 5;
}

message StartCompletionSessionRequest {
  int64 user_id = 1;
  int64 character_id = 2;
  int64 mission_id = 3;
}

message StartCompletionSessionResponse {
  int64 mission_id = 1;
  MissionStatus status = 2;
  CompletionQuestion question = 3;
}

message SubmitCompletionAnswerRequest {
  int64 user_id = 1;
  int64 character_id = 2;
  int64 mission_id = 3;
  string answer = 4;
}

message SubmitCompletionAnswerResponse {
  int64 mission_id = 1;
  MissionStatus status = 2;
  CompletionAnswer answer = 3;
  MissionReward reward = 4;
  WalletSnapshot wallet = 5;
  string character_message = 6;
}

message UpsertMissionFeedbackRequest {
  int64 user_id = 1;
  int64 mission_id = 2;
  MissionFeedbackType feedback_type = 3;
  MissionFeedbackReaction reaction = 4;
  optional string reason_code = 5;
  optional string reason_text = 6;
}

message UpsertMissionFeedbackResponse {
  int64 mission_id = 1;
  MissionFeedbackType feedback_type = 2;
  MissionFeedbackReaction reaction = 3;
  string reason_code = 4;
  string reason_text = 5;
  string updated_at = 6;
}

message Mission {
  int64 id = 1;
  string mission_date = 2;
  int32 stack_order = 3;
  string title = 4;
  string description = 5;
  string character_message = 6;
  MissionCategory category = 7;
  MissionDifficulty difficulty = 8;
  int32 reward_star_piece = 9;
  MissionStatus status = 10;
}

message TodayMission {
  int64 id = 1;
  int32 stack_order = 2;
  string title = 3;
  MissionCategory category = 4;
  MissionDifficulty difficulty = 5;
  int32 reward_star_piece = 6;
  MissionStatus status = 7;
  string character_message = 8;
  string created_at = 9;
  string completed_at = 10;
  string rejected_at = 11;
  string completion_question = 12;
  string answer_preview = 13;
  bool has_answer = 14;
}

message MissionDetail {
  int64 id = 1;
  string mission_date = 2;
  int32 stack_order = 3;
  string title = 4;
  string description = 5;
  string character_message = 6;
  MissionCategory category = 7;
  MissionDifficulty difficulty = 8;
  int32 reward_star_piece = 9;
  MissionStatus status = 10;
  string created_at = 11;
  string completed_at = 12;
  string rejected_at = 13;
  CompletionQuestion question = 14;
  CompletionAnswer answer = 15;
  string completion_character_response = 16;
  bool has_answer = 17;
}

message MissionSummary {
  int64 id = 1;
  string title = 2;
  int32 stack_order = 3;
}

message CompletionQuestion {
  int64 id = 1;
  string text = 2;
  CompletionInputType input_type = 3;
  int32 min_length = 4;
  int32 max_length = 5;
}

message CompletionAnswer {
  string text = 1;
  string answered_at = 2;
}

message MissionReward {
  int32 star_piece = 1;
  int32 affection = 2;
}

message WalletSnapshot {
  int32 star_piece = 1;
}

enum MissionStatus {
  MISSION_STATUS_UNSPECIFIED = 0;
  MISSION_STATUS_GENERATED = 1;
  MISSION_STATUS_OFFERED = 2;
  MISSION_STATUS_ANSWERING = 3;
  MISSION_STATUS_COMPLETED = 4;
  MISSION_STATUS_REJECTED = 5;
  MISSION_STATUS_EXPIRED = 6;
}

enum MissionCategory {
  MISSION_CATEGORY_UNSPECIFIED = 0;
  MISSION_CATEGORY_BASIC_ROUTINE = 1;
  MISSION_CATEGORY_SPACE_RESET = 2;
  MISSION_CATEGORY_BODY_CARE = 3;
  MISSION_CATEGORY_OUTDOOR_LIGHT = 4;
  MISSION_CATEGORY_MIND_RECORD = 5;
  MISSION_CATEGORY_REST_RECOVERY = 6;
  MISSION_CATEGORY_SOCIAL_LIGHT = 7;
}

enum MissionDifficulty {
  MISSION_DIFFICULTY_UNSPECIFIED = 0;
  MISSION_DIFFICULTY_EASY = 1;
  MISSION_DIFFICULTY_NORMAL = 2;
  MISSION_DIFFICULTY_CHALLENGE = 3;
}

enum CompletionInputType {
  COMPLETION_INPUT_TYPE_UNSPECIFIED = 0;
  COMPLETION_INPUT_TYPE_TEXT = 1;
}

enum MissionFeedbackType {
  MISSION_FEEDBACK_TYPE_UNSPECIFIED = 0;
  MISSION_FEEDBACK_TYPE_REJECTION = 1;
  MISSION_FEEDBACK_TYPE_SATISFACTION = 2;
}

enum MissionFeedbackReaction {
  MISSION_FEEDBACK_REACTION_UNSPECIFIED = 0;
  MISSION_FEEDBACK_REACTION_LIKE = 1;
  MISSION_FEEDBACK_REACTION_DISLIKE = 2;
}
