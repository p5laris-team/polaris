server:
  port: ${SERVER_PORT}

spring:
  application:
    name: gateway

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%thread] [traceId=%X{traceId}] %logger{36} - %msg%n"

grpc:
  client:
    user:
      address: ${USER_GRPC_ADDRESS}
      negotiationType: plaintext
    character:
      address: ${CHARACTER_GRPC_ADDRESS}
      negotiationType: plaintext
    item:
      address: ${ITEM_GRPC_ADDRESS}
      negotiationType: plaintext
    mission:
      address: ${MISSION_GRPC_ADDRESS}
      negotiationType: plaintext
    ai:
      address: ${AI_GRPC_ADDRESS}
      negotiationType: plaintext
    notification:
      address: ${NOTIFICATION_GRPC_ADDRESS}
      negotiationType: plaintext

management:
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
  endpoints:
    web:
      exposure:
#        include: health,info,prometheus
        include: health,prometheus
  endpoint:
    health:
      show-details: never
#  health:
#    db:
#      enabled: true

jwt:
  secret: ${JWT_SECRET}
  access-expiration-ms: ${JWT_ACCESS_EXPIRATION_MS}
  refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS}

app:
  public-base-url: ${APP_PUBLIC_BASE_URL:https://p5laris.life}
  default-share-image-url: ${APP_DEFAULT_SHARE_IMAGE_URL:https://d24c6my56k1w5v.cloudfront.net/assets/share-cards/placeholder.png}
