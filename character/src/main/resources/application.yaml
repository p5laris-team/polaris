spring:
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:character/.env[.properties]

  application:
    name: character

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/character}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:12345678}

  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true

flyway:
  enabled: true
  locations: classpath:db/migration
  baseline-on-migrate: false
  validate-on-migrate: true

grpc:
  server:
    port: 9092
    reflection-service-enabled: true

  client:
    user:
      address: static://localhost:9091
      negotiationType: plaintext
    item:
      address: static://localhost:9093
      negotiationType: plaintext
    ai:
      address: static://localhost:9095
      negotiationType: plaintext

cloud:
  aws:
    region: ${AWS_REGION:ap-northeast-2}
    s3:
      bucket-name: ${S3_BUCKET_NAME:polaris-share-cards}
      public-domain: ${S3_PUBLIC_DOMAIN:https://cdn.p5laris.life}
      cors:
        enabled: ${S3_CORS_AUTO_CONFIGURE:false}
        allowed-origins: ${S3_CORS_ALLOWED_ORIGINS:http://127.0.0.1:5173,http://localhost:5173}

app:
  public-base-url: ${APP_PUBLIC_BASE_URL:https://p5laris.life}
