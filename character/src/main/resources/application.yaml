spring:
  application:
    name: character

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/character}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:12345678}

  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true

flyway:
  enabled: true
  locations: classpath:db/migration
  baseline-on-migrate: false
  validate-on-migrate: true

grpc:
  server:
    port: 9092
    reflection-service-enabled: true

  client:
    user:
      address: static://localhost:9091
      negotiationType: plaintext
    item:
      address: static://localhost:9093
      negotiationType: plaintext
    mission:
      address: static://localhost:9094
      negotiationType: plaintext
    ai:
      address: static://localhost:9095
      negotiationType: plaintext

cloud:
  r2:
    credentials:
      access-key: ${R2_ACCESS_KEY:dummy-key}
      secret-key: ${R2_SECRET_KEY:dummy-secret}
    endpoint: ${R2_ENDPOINT:https://dummy.r2.cloudflarestorage.com}
    bucket-name: ${R2_BUCKET_NAME:polaris-share-cards}
    public-domain: ${R2_PUBLIC_DOMAIN:https://cdn.polaris.app}