spring:
  application:
    name: item

  datasource:
    url: ${DB_URL}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true

flyway:
  enabled: true
  locations: classpath:db/migration
  baseline-on-migrate: false
  validate-on-migrate: true

grpc:
  server:
    port: ${GRPC_SERVER_PORT}
    reflection-service-enabled: true

  client:
    user:
      address: ${USER_GRPC_ADDRESS}
      negotiationType: plaintext
    character:
      address: ${CHARACTER_GRPC_ADDRESS}
      negotiationType: plaintext
    mission:
      address: ${MISSION_GRPC_ADDRESS}
      negotiationType: plaintext
    ai:
      address: ${AI_GRPC_ADDRESS}
      negotiationType: plaintext