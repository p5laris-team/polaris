spring:
  application:
    name: item

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/item}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:12345678}

  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true

grpc:
  server:
    port: 9093

  client:
    user:
      address: static://localhost:9091
      negotiationType: plaintext
    character:
      address: static://localhost:9092
      negotiationType: plaintext
    mission:
      address: static://localhost:9094
      negotiationType: plaintext
    ai:
      address: static://localhost:9095
      negotiationType: plaintext