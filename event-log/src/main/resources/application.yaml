server:
  port: ${SERVER_PORT}

spring:
  application:
    name: event-log

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/event_log}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:12345678}

  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true

flyway:
  enabled: true
  locations: classpath:db/migration
  baseline-on-migrate: false
  validate-on-migrate: true

grpc:
  server:
    port: ${GRPC_SERVER_PORT:9099}
    reflection-service-enabled: ${GRPC_REFLECTION_ENABLED:false}

internal:
  grpc-auth:
    enabled: ${INTERNAL_GRPC_AUTH_ENABLED:true}
    token: ${INTERNAL_GRPC_AUTH_TOKEN:}

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: never
  health:
    db:
      enabled: true
