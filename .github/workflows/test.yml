name: Test and Coverage

on:
  pull_request:
    branches:
      - dev
      - main
  push:
    branches:
      - dev
      - main
      - testcode
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests, coverage, and API docs
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant Gradle wrapper permission
        run: chmod +x ./gradlew

      - name: Run tests and coverage gate
        run: ./gradlew :jacocoTestReport :jacocoTestCoverageVerification

      - name: Generate REST Docs
        run: ./gradlew :gateway:asciidoctor

      - name: Upload JaCoCo report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: build/reports/jacoco/test/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            */build/reports/tests/coverageTest/
            */build/test-results/coverageTest/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload REST Docs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rest-docs
          path: docs/api/
          if-no-files-found: warn
          retention-days: 14
